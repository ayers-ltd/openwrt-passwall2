name: Test build

on:
  push:
    branches: [main]
    paths:
      - 'luci-app-passwall2/**'
      - '.github/workflows/test-build.yml'
  pull_request:
    paths:
      - 'luci-app-passwall2/**'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-build:
    name: OpenWrt 24.10.4 / x86_64 / IPK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDK_BASE_URL: https://downloads.openwrt.org/releases/24.10.4/targets/x86/64
      SDK_ARCHIVE: openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_SHA256: 229e871f734a2cee5ce3ad6a3e98d3836b0899bfdeaea4d9c2c5cc7b1fce1407
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl xz-utils zstd

      - name: Download and verify SDK
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$SDK_ARCHIVE"
          echo "$SDK_SHA256  $SDK_ARCHIVE" | sha256sum --check --strict
          mkdir sdk
          tar --zstd -xf "$SDK_ARCHIVE" -C sdk --strip-components=1

      - name: Install feeds and local package
        working-directory: ${{ runner.temp }}/sdk
        run: |
          # Use the SDK's matching feeds, plus PassWall's dependency definitions.
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Build the checked-out commit (including PR changes), not the remote main branch.
          mkdir -p package/passwall2
          cp -a "$GITHUB_WORKSPACE/luci-app-passwall2" package/passwall2/
          {
            echo "source_commit=$GITHUB_SHA"
            echo "sdk=$SDK_ARCHIVE"
            for feed in feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                echo "$(basename "$feed")=$(git -C "$feed" rev-parse HEAD)"
              fi
            done
          } > build-info.txt

      - name: Configure package build
        working-directory: ${{ runner.temp }}/sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-app-passwall2=m
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_LUCI_LANG_zh_Hant=y
          EOF
          make defconfig
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall2=m' .config

      - name: Compile LuCI package
        working-directory: ${{ runner.temp }}/sdk
        run: |
          set -o pipefail
          make package/luci-app-passwall2/compile -j"$(nproc)" V=s 2>&1 | tee build.log
          mkdir -p artifacts
          find bin/packages -type f \( -name 'luci-app-passwall2_*.ipk' -o -name 'luci-i18n-passwall2-*.ipk' \) \
            -exec cp -t artifacts {} +
          compgen -G 'artifacts/luci-app-passwall2_*.ipk' > /dev/null

      - name: Upload packages and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passwall2-test-x86_64-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/sdk/artifacts/*.ipk
            ${{ runner.temp }}/sdk/build.log
            ${{ runner.temp }}/sdk/build-info.txt
            ${{ runner.temp }}/sdk/.config
